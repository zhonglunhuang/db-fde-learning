# 海豹學院 Day 06 部署實作：三個容器組成一個完整的應用程式。
#   web  Caddy：對外開 80／443，提供前端頁面，並把 /api 轉給 api
#   api  Node.js：商業邏輯，讀寫資料庫（不對外開 port）
#   db   PostgreSQL：資料存在 db_data volume（不對外開 port）
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: academy
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請先建立 .env 並設定 POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: academy
      PGUSER: academy
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
